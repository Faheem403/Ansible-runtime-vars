---
- hosts: webservers
  become: true
  tasks:
    - name: install a webserver
      yum:
        name: "{{package_name}}"
        state: present
    - name: copy index.html file
      copy:
        src: index.html
        dest: /var/www/html/index.html
    - name: start the service
      service:
        name: "{{package_name}}"
        state: started
        enabled: true
...
